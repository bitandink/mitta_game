<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Mitta’s Airline | 할로윈섬</title>
    <style>
        :root {
            font-family: system-ui, 'Malgun Gothic', sans-serif;
            color: #fff;
            background: #100d29
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: radial-gradient(circle at top, #423077, #100d29 70%);
            min-height: 100vh
        }

        header {
            text-align: center;
            padding: 20px 12px 12px
        }

        h1 {
            margin: 0;
            font-size: clamp(23px, 4vw, 38px)
        }

        .sub {
            color: #ddd0ff;
            margin: 6px
        }

        .shell {
            max-width: 1000px;
            margin: auto;
            padding: 0 12px 32px
        }

        .bar {
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            background: #211942;
            border: 1px solid #6652a0;
            border-radius: 16px;
            padding: 12px 16px;
            margin-bottom: 12px
        }

        .bar button,
        .action {
            background: #ffba48;
            color: #271333;
            border: 0;
            border-radius: 12px;
            padding: 10px 16px;
            font-weight: 800;
            cursor: pointer
        }

        .map {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            background: url('map.jpg') center/100% 100%;
            border: 3px solid #8b6aca;
            border-radius: 20px;
            box-shadow: 0 15px 50px #050211;
            overflow: hidden
        }

        .spot {
            position: absolute;
            transform: translate(-50%, -50%);
            width: 8%;
            aspect-ratio: 1;
            border: 2px solid #fff8a7;
            border-radius: 50%;
            background: #261454ba;
            color: white;
            font-size: clamp(14px, 2.8vw, 26px);
            cursor: pointer;
            box-shadow: 0 0 0 4px #b46cff66, 0 0 18px #f5baff;
            transition: transform .15s
        }

        .spot:hover {
            transform: translate(-50%, -50%) scale(1.15)
        }

        .spot.done {
            background: #28744dce;
            border-color: #91ffbb
        }

        .hint {
            text-align: center;
            color: #ded3f7;
            font-size: 13px;
            margin: 12px
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: #070416db;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 5
        }

        .hidden {
            display: none
        }

        .panel {
            width: min(100%, 480px);
            max-height: 90vh;
            overflow: auto;
            background: #241b48;
            border: 2px solid #9b78e5;
            border-radius: 22px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 20px 70px #000
        }

        .panel h2 {
            margin: 0 0 10px
        }

        .panel p {
            line-height: 1.6;
            color: #e3d9ff
        }

        input {
            background: #110d28;
            color: white;
            border: 1px solid #aa8fea;
            padding: 12px;
            border-radius: 10px;
            width: 100%;
            font-size: 17px
        }

        .choices {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin: 18px 0
        }

        .choices button {
            font-size: 29px;
            padding: 20px 4px;
            border-radius: 14px;
            background: #4d377e;
            color: white;
            border: 2px solid #8868c4;
            cursor: pointer
        }

        .choices button:disabled {
            opacity: .55
        }

        .msg {
            min-height: 28px;
            color: #ffdd8e;
            font-weight: 700
        }

        .secondary {
            background: #51406e;
            color: white
        }

        .tiny {
            font-size: 12px;
            color: #bbb0db
        }

        .progress {
            font-weight: 800;
            color: #ffe399
        }

        .cert {
            border: 2px dashed #ffd176;
            padding: 18px;
            border-radius: 16px;
            background: #3a265e;
            margin: 12px 0
        }

        button:focus-visible {
            outline: 3px solid #fff
        }

        #close {
            float: right;
            background: none;
            border: 0;
            color: white;
            font-size: 23px;
            cursor: pointer
        }
    </style>
</head>

<body>
    <header>
        <h1>✈️ Mitta’s Airline</h1>
        <p class="sub">🎃 할로윈섬에서 길 잃은 느요미 · PLAYABLE DEMO v0.1</p>
    </header>
    <main class="shell">
        <div class="bar"><span>승객: <b id="nameLabel">-</b></span><span class="progress" id="progress">⭐ 0 /
                3</span><button onclick="showCertificate()">탑승 인증서</button></div>
        <div class="map" aria-label="할로윈섬 게임 지도"><button class="spot" style="left:45%;top:36%"
                onclick="openStage('fire')" aria-label="불타는 동굴">🔥</button><button class="spot" style="left:66%;top:36%"
                onclick="openStage('potion')" aria-label="사랑의 묘약 가게">🧪</button><button class="spot"
                style="left:69%;top:75%" onclick="openStage('ghost')" aria-label="반짝이는 유령 연못">👻</button></div>
        <p class="hint">반짝이는 🔥 🧪 👻 아이콘을 눌러 퍼즐에 도전하세요. 다른 장소는 다음 업데이트에서 개방됩니다.</p>
    </main>
    <div id="overlay" class="overlay hidden">
        <section class="panel"><button id="close" onclick="closeModal()" aria-label="닫기">×</button>
            <div id="content"></div>
        </section>
    </div>
    <script>
        const KEY = 'mitta-halloween-v01'; let data = { name: '', done: [] }; try { data = { ...data, ...JSON.parse(localStorage.getItem(KEY) || '{}') } } catch { }; let current = '', seq = [], index = 0, lock = false, potion = [], ghostAnswer = 0; const $ = id => document.getElementById(id); function save() { localStorage.setItem(KEY, JSON.stringify(data)); render() } function render() { $('nameLabel').textContent = data.name || '-'; $('progress').textContent = `⭐ ${data.done.length} / 3`; document.querySelectorAll('.spot').forEach((el, i) => el.classList.toggle('done', data.done.includes(['fire', 'potion', 'ghost'][i]))) } function modal(html) { $('content').innerHTML = html; $('overlay').classList.remove('hidden') } function closeModal() { $('overlay').classList.add('hidden'); current = '' } function start() { let name = $('nick').value.trim().slice(0, 20); if (!name) { $('entryMsg').textContent = '닉네임을 입력해 주세요!'; return } data.name = name; save(); closeModal() } function entry() { modal(`<h2>🎟️ 탑승 수속</h2><p>할로윈섬에 오신 걸 환영합니다!<br>승객님의 닉네임을 알려주세요.</p><input id="nick" maxlength="20" placeholder="승객 닉네임" value="${escapeHtml(data.name)}"><p id="entryMsg" class="msg"></p><button class="action" onclick="start()">탑승하기 ✈️</button>`) } function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])) } function openStage(id) { if (!data.name) { entry(); return } current = id; if (id === 'fire') fireStart(); if (id === 'potion') potionStart(); if (id === 'ghost') ghostStart() } function finish() { if (!data.done.includes(current)) data.done.push(current); save(); let all = data.done.length === 3; modal(`<h2>✨ 퍼즐 클리어!</h2><p>마법의 별조각을 획득했어요! ⭐</p><p class="progress">${data.done.length} / 3 수집</p>${all ? '<p>🎉 모든 별조각을 모았습니다! 인증서를 확인하세요.</p>' : ''}<button class="action" onclick="closeModal()">지도로 돌아가기</button>`) }
        function fireStart() { seq = Array.from({ length: 4 }, () => Math.floor(Math.random() * 4)); index = 0; lock = true; modal(`<h2>🔥 불타는 동굴</h2><p>불꽃이 반짝이는 순서를 기억하세요!<br>4개의 순서를 맞히면 성공.</p><div id="fireDisplay" style="font-size:56px;min-height:85px">👀</div><div class="choices" id="fireChoices">${['🔴', '🔵', '🟡', '🟢'].map((e, i) => `<button onclick="fireTap(${i})">${e}</button>`).join('')}</div><p class="msg" id="fireMsg">잠시 후 순서가 나타납니다.</p><button class="action secondary" onclick="fireStart()">다시 보기</button>`); document.querySelectorAll('#fireChoices button').forEach(b => b.disabled = true); let run = 0; function show() { if (current !== 'fire') return; if (run < seq.length) { $('fireDisplay').textContent = ['🔴', '🔵', '🟡', '🟢'][seq[run++]]; setTimeout(() => { $('fireDisplay').textContent = '✨'; setTimeout(show, 380) }, 750) } else { $('fireDisplay').textContent = '❓'; $('fireMsg').textContent = '이제 순서대로 눌러 보세요!'; lock = false; document.querySelectorAll('#fireChoices button').forEach(b => b.disabled = false) } } setTimeout(show, 700) } function fireTap(i) { if (lock || current !== 'fire') return; if (seq[index] !== i) { $('fireMsg').textContent = '앗! 순서가 달라요. 다시 도전!'; lock = true; setTimeout(() => { if (current === 'fire') fireStart() }, 850); return } index++; $('fireMsg').textContent = `정답! ${index} / 4`; if (index === 4) { lock = true; setTimeout(finish, 350) } }
        function potionStart() { potion = []; modal(`<h2>🧪 사랑의 묘약 가게</h2><p>마법사의 주문서:<br><b>달빛 → 별가루 → 하트</b><br>순서대로 재료를 넣어 묘약을 완성하세요!</p><div class="choices">${[['🌙', 'moon'], ['💖', 'heart'], ['⭐', 'star'], ['🍄', 'mushroom']].map(([e, v]) => `<button onclick="potionTap('${v}')">${e}</button>`).join('')}</div><p class="msg" id="potionMsg">가마솥: 비어 있음</p><button class="action secondary" onclick="potionStart()">처음부터</button>`) } function potionTap(v) { const answer = ['moon', 'star', 'heart']; if (v !== answer[potion.length]) { $('potionMsg').textContent = '💥 펑! 재료 순서가 틀렸어요. 다시 시작!'; potion = []; return } potion.push(v); $('potionMsg').textContent = `✨ 재료 ${potion.length} / 3 투입 성공!`; if (potion.length === 3) setTimeout(finish, 450) }
        function ghostStart() { ghostAnswer = Math.floor(Math.random() * 4); const faces = ['👻', '👻', '👻', '👻']; modal(`<h2>👻 반짝이는 유령 연못</h2><p>잠깐 빛나는 유령의 위치를 기억하세요!</p><div class="choices" id="ghostChoices">${faces.map((e, i) => `<button id="g${i}" onclick="ghostTap(${i})" disabled>${e}</button>`).join('')}</div><p class="msg" id="ghostMsg">빛나는 유령을 잘 보세요...</p><button class="action secondary" onclick="ghostStart()">다시 보기</button>`); setTimeout(() => { if (current !== 'ghost') return; $('g' + ghostAnswer).style.background = '#e257c9'; $('g' + ghostAnswer).style.boxShadow = '0 0 25px #ff8bf1'; setTimeout(() => { if (current !== 'ghost') return; document.querySelectorAll('#ghostChoices button').forEach(b => { b.style.background = ''; b.style.boxShadow = ''; b.disabled = false }); $('ghostMsg').textContent = '어느 유령이 빛났을까요?' }, 1300) }, 650) } function ghostTap(i) { if (i === ghostAnswer) finish(); else { $('ghostMsg').textContent = '아쉬워요! 다시 잘 살펴보세요.'; document.querySelectorAll('#ghostChoices button').forEach(b => b.disabled = true); setTimeout(() => { if (current === 'ghost') ghostStart() }, 800) } }
        function showCertificate() { if (!data.name) { entry(); return } if (data.done.length < 3) { modal(`<h2>🎟️ 탑승 기록</h2><p>${escapeHtml(data.name)} 승객님, 별조각을 ${data.done.length}개 모았어요.</p><p>3개를 모으면 할로윈섬 탐험 인증서가 열립니다!</p><button class="action" onclick="closeModal()">계속 탐험하기</button>`); return } modal(`<h2>🏆 할로윈섬 탐험 인증서</h2><div class="cert"><p>✈️ Mitta’s Airline</p><h2>🎃 HALLOWEEN ISLAND</h2><h3>${escapeHtml(data.name)}</h3><p>할로윈섬의 마법 퍼즐을 해결한<br>용감한 승객으로 인증합니다.</p><p>⭐ ⭐ ⭐</p></div><button class="action" onclick="closeModal()">확인</button><p class="tiny">이 화면을 캡처해서 공유해 보세요!</p>`) } render(); if (!data.name) entry();
    </script>
</body>

</html>
