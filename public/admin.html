<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>미타에어 코드 관리자</title><style>body{font:15px system-ui;background:#1c1630;color:#fff;max-width:740px;margin:36px auto;padding:15px}input,button{padding:10px;margin:4px;border-radius:7px}li{padding:10px;border-bottom:1px solid #645279}button{cursor:pointer}small{color:#ddd}</style><h1>✈️ 입장코드 관리자</h1><p>관리자 키를 입력하면 등록된 코드의 상태를 볼 수 있어. 실제 코드 원문은 이 화면에 저장되지 않아.</p><input id="key" type="password" placeholder="ADMIN_SECRET"><button id="load">조회</button><p id="msg"></p><ul id="list"></ul><script>const $=s=>document.querySelector(s);async function call(method='GET',hash){const r=await fetch('/api/admin',{method,headers:{'Content-Type':'application/json','x-admin-key':$('#key').value},body:method==='POST'?JSON.stringify({hash}):undefined});const d=await r.json();if(!r.ok)throw Error(d.error);return d}async function load(){try{const d=await call();$('#list').replaceChildren();for(const c of d.codes){const li=document.createElement('li');li.textContent=`${c.label} — ${c.code_hash.slice(0,10)}… `;const active=d.gate?.active_hash===c.code_hash;if(active)li.append(' [현재 사용 중]');else{const b=document.createElement('button');b.textContent='이 코드 활성화';b.onclick=async()=>{if(!confirm('기존 코드 사용자의 1시간 유예가 시작돼. 변경할까?'))return;try{await call('POST',c.code_hash);load()}catch(e){$('#msg').textContent=e.message}};li.append(b)}$('#list').append(li)}$('#msg').textContent='코드 '+d.codes.length+'개'}catch(e){$('#msg').textContent=e.message}}$('#load').onclick=load;</script></html>
