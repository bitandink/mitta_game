<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>미타에어 탑승 게이트</title><style>body{font:16px/1.7 system-ui;background:#1d1534;color:#fff;min-height:100vh;display:grid;place-items:center;margin:0}.card{width:min(430px,90vw);padding:28px;background:#35254e;border:1px solid #9773ba;border-radius:18px;text-align:center}input,button{box-sizing:border-box;width:100%;padding:13px;margin-top:12px;border-radius:9px;font:inherit}button{background:#aa7ade;color:#1b0e2e;border:0;font-weight:700;cursor:pointer}input{background:#fff;color:#222;border:0}small{color:#ffd4d4}</style><div class="card"><h1>✈️ Mitta's Airline</h1><p>🎃 할로윈섬 탑승코드를 입력해 주세요.</p><form id="f"><input id="c" required autocomplete="off" maxlength="40" placeholder="입장코드"><button>탑승 수속하기</button></form><p><small id="m" role="status"></small></p></div><script>document.querySelector('#f').onsubmit=async e=>{e.preventDefault();const m=document.querySelector('#m');m.textContent='확인 중...';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:document.querySelector('#c').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'인증 실패');location.replace('/')}catch(err){m.textContent=err.message}}</script></html>
